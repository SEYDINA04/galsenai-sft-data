# ═══════════════════════════════════════════════════════════════════
#  candidates.yaml — datasets CIBLÉS mais absents du build.
#
#  Complète `configs/build.yaml` (ce qui entre) par ce qui n'entre pas, et
#  pourquoi. Sans ce fichier, le périmètre du dataset serait une liste plate
#  d'identifiants sans justification : l'exclusion d'une source est une
#  décision, elle doit être tracée au même titre que l'inclusion.
#
#  `galsenai-sft inventory` mesure ces datasets à la source (API HuggingFace)
#  au même titre que ceux du build : on sait donc combien de données on
#  renonce à utiliser, tâche par tâche.
#
#  status:
#    excluded  — écarté, décision prise (motif obligatoire)
#    candidate — retenu par le ciblage, converter pas encore écrit
#
#  Méthodologie et sources : docs/targeting.md
# ═══════════════════════════════════════════════════════════════════
datasets:
  # ───────────────────────── Doublons de contenu ─────────────────────────
  # Mêmes 47 463 lignes que `ngia/alpaca-data-in-wolof` (intégré), rediffusées
  # dans deux autres formats. Les intégrer ne produirait que des doublons —
  # écartés de toute façon par la déduplication globale, mais autant ne pas
  # payer le téléchargement.
  - id: vonewman/alpaca-dataset-wolof
    task: instruction
    split: train
    status: excluded
    reason: >-
      Reconditionnement d'alpaca-data-in-wolof au format Alpaca (même compte
      exact : 47 463). Déjà couvert par la source d'origine, intégrée.

  - id: vonewman/alpaca-sharegpt-wolof
    task: instruction
    split: train
    status: excluded
    reason: >-
      Même contenu que ci-dessus, au format ShareGPT. Aucun apport de volume.

  - id: vonewman/wolof-instruction-dataset-alpaca
    task: instruction
    split: train
    status: excluded
    reason: "Dépôt quasi vide (parquet de 9 Ko) : volume négligeable."

  # ───────────────────────── NER — plafond mondial atteint ─────────────────
  - id: masakhane/masakhaner
    task: ner
    config: wol
    split: train
    status: candidate
    reason: >-
      MasakhaNER 1.0 (1 871 lignes wolof). Largement inclus dans MasakhaNER 2.0
      désormais intégré ; l'écart résiduel ne justifie pas encore un converter.
      L'API taille ne répond pas (501) : le dataset repose sur un script.

  - id: masakhane/masakhaner-x
    task: ner
    split: train
    status: candidate
    reason: >-
      Agrégat MasakhaNER 1.0 + 2.0 en annotations de *spans* (format plus
      proche du SFT que le BIO). Recouvrement quasi total avec l'intégré.

  # ───────────────────────── Retrieval — capacité à zéro ──────────────────
  - id: miracl/miracl
    task: retrieval
    config: fr
    split: train
    status: candidate
    reason: >-
      `TaskType.RETRIEVAL` existe dans le schéma mais aucun converter ne
      l'alimente : la capacité IR reste à zéro après la v0.2. L'API taille
      répond 501 (script de chargement) — passer par la branche parquet.

  # ───────────────────────── Tool use — reste à intégrer ──────────────────
  - id: Salesforce/xlam-function-calling-60k
    task: tool_use
    split: train
    status: candidate
    reason: >-
      Dépôt *gated* : l'API taille répond 404 tant que les conditions ne sont
      pas acceptées. Volume annoncé par la source : 60 000 appels
      exécutés-vérifiés. À débloquer manuellement puis intégrer.

  - id: Salesforce/APIGen-MT-5k
    task: tool_use
    split: train
    status: candidate
    reason: >-
      5 000 trajectoires multi-tours de référence. Le format multi-tours est
      désormais supporté (Toucan) : intégrable sans nouveau travail de schéma.

  # ───────────────────────── Intent — pas de wolof disponible ─────────────
  - id: AmazonScience/massive
    task: intent
    config: fr-FR
    split: train
    status: candidate
    reason: >-
      Aucune variante wolof n'existe. Utilisable seulement par localisation
      (protocole INJONGO) — c'est un travail de production de données, pas
      d'intégration. L'intent plafonne à ~15 000 exemples sans cela.
