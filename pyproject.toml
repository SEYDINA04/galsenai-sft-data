[project]
name = "galsenai-sft-data"
version = "0.1.0"
description = "Plateforme de préparation de datasets d'instruction (SFT) en wolof pour le projet GalsenAI LLM."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Babacar Ndao" }, { name = "GalsenAI Data Team" }]
keywords = ["wolof", "sft", "instruction-tuning", "chatml", "llm", "galsenai"]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "datasets>=2.19",
    "pyarrow>=15.0",
    "huggingface-hub>=0.23",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
lid = ["fasttext-wheel>=0.9.2"]
dev = [
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
galsenai-sft = "galsenai_sft.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/galsenai_sft"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]
"src/galsenai_sft/cli.py" = ["B008"]  # Typer requiert les appels Option/Argument en défaut
