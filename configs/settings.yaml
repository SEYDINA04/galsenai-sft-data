# ───────────────────────────────────────────────────────────────
#  settings.yaml — configuration de la plateforme.
#  Toute valeur est surchargeable ici (aucun hardcode ailleurs).
# ───────────────────────────────────────────────────────────────

lid:
  repo_id: cis-lmu/glotlid
  filename: model_v3.bin      # épinglé v3 (jamais model.bin)
  target_label: wol_Latn
  threshold: 0.5

quality:
  min_chars: 1
  max_chars: 50000
  drop_duplicates: true

hf:
  repo: galsenai/wolof_sft
  repo_type: dataset
  token_env: HF_TOKEN

# ─── Garde-fou mémoire ────────────────────────────────────────────────
# Le build écrit au fil de l'eau (mémoire constante). Ce garde-fou est la
# 2ᵉ ligne de défense : sous le plancher de RAM libre, le build s'arrête
# proprement (fichiers fermés, manifest écrit) au lieu de figer la machine.
# 3ᵉ ligne : plafond dur cgroup via « make build ».
memory:
  min_available_mb: 1536      # 0 = surveillance désactivée
  max_rss_mb: null            # plafond propre au processus (null = aucun)
  interval_s: 2.0

build:
  streaming: true             # lire les datasets en flux (jamais tout télécharger)
  batch_size: 1000            # lignes par lot parquet
  log_every: 5000             # progression toutes les N écritures

# Corpus de pré-entraînement pour la décontamination.
# ⚠️ NE PAS activer sur le build d'ENTRAÎNEMENT : ces datasets sont déjà dans le
# corpus de pré-entraînement -> la décontamination viderait le dataset.
# À réserver au futur jeu d'ÉVALUATION (anti-fuite). Activation : --decontaminate.
pretraining_corpus_paths:
  - ../wolof_scraper/src/wolof_unified_corpus/data/train-00000-of-00001.parquet
